<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

    p {

    }

    .box {
      background: #1e293b;

    .price {

    }

    button {
      background: #22c55e;
      color: black;
      padding: 18px 40px;

    }

<body>

<div class="container">

  <h1>Launch Your Merch Brand in <span class="highlight">24 Hours</span></h1>

  <p>No design skills. No inventory. No experience.</p>

  <div class="box">
    <h2>What You Get:</h2>
    <ul>
      <li>✔ 5 Ready-to-Sell T-Shirt Designs</li>
      <li>✔ 3 Viral Promo Videos</li>
      <li>✔ 10 Product Mockups</li>
      <li>✔ Print-Ready Files</li>
      <li>✔ Step-by-Step Launch Guide</li>
    </ul>
  </div>

  <div class="price">$97 One-Time</div>

  <button onclick="startCheckout('price_1TCKuQFDSH6ZYT597LjxzqU0')">
    Get Instant Access
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://rpjvvsknkxzvunzcszno.supabase.co",
  "sb_publishable_Sg29g7Bc5B3S2AEl0Qt6dg_1PPZQQGY"
);

// Capture affiliate
const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");

if (ref) {
  localStorage.setItem("affiliate_ref", ref);
}

// Checkout
async function startCheckout(priceId) {
  try {
    const affiliateCode = localStorage.getItem("affiliate_ref");

    const response = await fetch("/.netlify/functions/create-checkout", {
      method: "POST",
      body: JSON.stringify({
        priceId: priceId,
        affiliateCode: affiliateCode
      })
    });

    const data = await response.json();

    if (data.url) {
      window.location.href = data.url;
    } else {
      alert("Checkout error");
      console.error(data);
    }

  } catch (err) {
    console.error(err);
    alert("Something went wrong");
  }
}
</script>
