<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Printsable Creator Kit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
    }

    h1 {
      font-size: 2.5em;
    }

    .highlight {
      color: #22c55e;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      text-align: left;
    }

    button {
      background: #22c55e;
      color: black;
      padding: 15px 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Launch Your Merch Brand in <span class="highlight">24 Hours</span></h1>

  <p>No design skills. No inventory. No experience.</p>

  <div class="box">
    <h2>What You Get:</h2>
    <ul>
      <li>✔ 5 Ready-to-Sell T-Shirt Designs</li>
      <li>✔ 3 Viral Promo Videos</li>
      <li>✔ 10 Product Mockups</li>
      <li>✔ Print-Ready Files</li>
      <li>✔ Step-by-Step Launch Guide</li>
    </ul>
  </div>

  <h2>$97 One-Time</h2>

  <button onclick="startCheckout('YOUR_STRIPE_PRICE_ID')">
    Get Instant Access
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://rpjvvsknkxzvunzcszno.supabase.co",
  "YOUR_ANON_KEY"
);

// Capture affiliate
const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");
if (ref) localStorage.setItem("affiliate_ref", ref);

// Checkout function
async function startCheckout(priceId) {
  const affiliateCode = localStorage.getItem("affiliate_ref");

  const res = await fetch("/.netlify/functions/create-checkout", {
    method: "POST",
    body: JSON.stringify({ priceId, affiliateCode })
  });

  const data = await res.json();
  window.location.href = data.url;
}
</script>

</body>
</html>
